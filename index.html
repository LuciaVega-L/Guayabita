<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guayabita</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1>Guayabita, a Apostar!</h1>
</header>
<main>
    <section class="contenedor">

        <form id="formDatosIniciales" class="tarjeta">
            <section class="campo">
                <label for="cantJugadores">Ingrese la cantidad de jugadores:</label>
                <input type="number" id="cantJugadores" name="cantJugadores" min="2" max="10">
            </section>

            <section class="campo">
                <label for="cuotaInicial">Ingrese la cuota inicial del pote</label>
                <input type="number" id="cuotaInicial" name="cuotaInicial" min="1">
            </section>

            <button type="button" id="btnJugar" name="btnJugar">JUGAR!</button>
        </form>

        <p id="resultadoJugadorInicial"></p>
        <p id="poteActual"></p>

        <section id="decidirApostar" class="tarjeta" style="display: none;">
            <h2>A jugar!</h2>
            <p id="resultadoDado"></p>
            <button type="button" id="btnLanzarDado">Lanzar dado!</button>
            <p id="pierdeTurno"></p>

            <section id="zonaDecidirApostar" class="subtarjeta" style="display: none;">
                <p id="textoDecidirApostar"></p>

                <section class="grupo-radios">
                    <label for="apostar"><input type="radio" id="apostar" name="inputApostar" value="si"> SI</label>
                    <label for="noApostar"><input type="radio" id="noApostar" name="inputApostar" value="no"> NO</label>
                    <button type="button" id="btnDecidirApostar">Confirmar</button>
                </section>

                <section id="zonaCantidadApostar" class="subtarjeta" style="display: none;">
                    <h3>Tu apuesta</h3>
                    <section id="camposApuesta">
                        <section class="campo">
                            <label for="cantidadApostar">¿Cuánto quieres apostar?</label>
                            <input type="number" id="cantidadApostar" min="1">
                        </section>
                        <button type="button" id="btnConfirmarApuesta">Confirmar apuesta</button>
                    </section>
                    <button type="button" id="btnLanzarDadoApuesta" style="display: none;">Lanzar dado!</button>
                </section>
            </section>

            <p id="alertaPote"></p>
            <button type="button" id="btnSiguienteTurno" style="display: none;">Siguiente turno</button>
        </section>

    </section>

    <script src="logica.js"></script>
</main>
<footer>
    <p>Juego Guayabita. Apostar. Todos los derechos reservados :>.</p>
</footer>
</body>
</html>
